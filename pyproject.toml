[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bjd"
version = "0.1.0"
description = "Batch-convert observation times in a CSV or FITS table to BJD_TDB -- explicitly, or not at all."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RakTikoo" },
]
keywords = ["astronomy", "astrophysics", "exoplanet", "bjd", "bjd_tdb", "time"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=6.0",
    "numpy>=1.24",
]

[project.scripts]
bjd = "bjd.cli:main"

[project.urls]
Homepage = "https://github.com/RakTikoo/bjd"

[tool.setuptools]
packages = ["bjd"]
